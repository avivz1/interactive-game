<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Play on TV</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1020;
        color: #f4f6ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      a {
        display: block;
        margin: 16px auto;
        padding: 18px 28px;
        max-width: 320px;
        border-radius: 16px;
        background: #ffd600;
        color: #0b1020;
        font-size: 22px;
        font-weight: 700;
        text-decoration: none;
      }
      p {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Play on TV</h1>
      <a href="/tv/">📺 This is the TV</a>
      <a href="/phone/">📱 This is the phone</a>
      <p>On the TV browser open <b>/tv</b>. On the phone scan the QR code shown on the TV.</p>
    </main>
  </body>
</html>
